name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (Linux, engine crates only)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --exclude bilby --all-targets --locked -- -D warnings
      - name: Clippy (Windows, whole workspace)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test (Linux, engine crates only)
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude bilby --locked
      - name: Test (whole workspace)
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      # Prints timings and what each collector saw on the runner, so a PR
      # can quote them. These are smoke tests that already ran above.
      - name: Windows collector output
        if: runner.os == 'Windows'
        run: cargo test -p bilby-collect-windows --locked -- --nocapture --test-threads 1
      # #17: a collector that hangs for a minute times out and the scan
      # still finishes, with Failed("took too long") for it.
      - name: Hung collector times out
        if: runner.os == 'Windows'
        run: cargo test -p bilby-collect-windows --locked --features slow-collector-test --test scan -- --nocapture --test-threads 1
      # #16: with every online switch off, a full scan makes no network
      # connections. The guard feature panics if the HTTP client is built.
      - name: No network with online checks off
        run: cargo test -p bilby-reputation --locked --features no-network-guard -- --nocapture

  copy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Copy lint (docs/copy-guide.md)
        run: cargo test -p bilby-core --locked --test copy_lint -- --nocapture

  build-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache Tauri CLI
        id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}
      - name: Install Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version ${{ env.TAURI_CLI_VERSION }}
      - name: Build app
        working-directory: app/src-tauri
        run: cargo tauri build --no-bundle -- --locked
      # #17: the release exe writes a scrubbed snapshot without opening a
      # window. bilby.exe is a GUI program, so wait for it explicitly. Fails
      # if the runner's user or computer name, or an account SID, is in
      # either file.
      - name: Dump snapshot
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'snapshot.json'
          $p = Start-Process -FilePath target/release/bilby.exe -ArgumentList '--dump-snapshot', "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "bilby.exe --dump-snapshot exited with $($p.ExitCode)" }
          Get-Content "$out.checks.json"
          $summary = Get-Content "$out.checks.json" | ConvertFrom-Json
          if ($summary.took_ms -gt 90000) { Write-Output "::warning::full scan took $($summary.took_ms) ms, over the 90 second target" }
          foreach ($name in @($env:USERNAME, $env:COMPUTERNAME)) {
            $hits = Select-String -Path $out, "$out.checks.json" -Pattern $name -SimpleMatch
            if ($hits) { $hits | Select-Object -First 5 | Out-String | Write-Output; throw "the snapshot contains the runner's user or computer name" }
          }
          $sids = Select-String -Path $out, "$out.checks.json" -Pattern 'S-1-5-21-\d|S-1-12-1-\d'
          if ($sids) { throw "the snapshot contains $(@($sids).Count) account SID(s)" }
          Copy-Item $out snapshot.json
          Copy-Item "$out.checks.json" snapshot.json.checks.json
      # #18: the fresh runner snapshot may only show Medium-or-higher
      # findings that crates/bilby-core/tests/ci-allow.toml explains, so a
      # noisy rule fails the PR that made it.
      - name: Runner snapshot has no unexplained findings
        shell: pwsh
        env:
          BILBY_SNAPSHOT: ${{ github.workspace }}/snapshot.json
        run: cargo test -p bilby-core --locked --test baseline -- --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-snapshot
          path: |
            snapshot.json
            snapshot.json.checks.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilby-windows-x64
          path: target/release/bilby.exe
          retention-days: 7
          if-no-files-found: error

  no-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-no-npm.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Cache cargo-deny
        id: cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version ${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny --locked --all-features check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}
      - run: cargo audit --deny warnings
