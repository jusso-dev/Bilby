<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Bilby</title>
    <link rel="stylesheet" href="app.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path class="bm-ear" d="M17 25 C 12 14, 13 5, 17 3 C 22 6, 23 16, 22 25 Z"/>
          <path class="bm-ear" d="M24 25 C 22 14, 25 5, 29 4 C 33 8, 30 18, 28 26 Z"/>
          <path class="bm-head" d="M10 33 C 10 25, 18 21, 26 23 C 33 25, 40 30, 45 35 C 39 38, 30 40, 22 40 C 15 40, 10 38, 10 33 Z"/>
          <circle class="bm-eye" cx="27" cy="30" r="2"/>
        </svg>
        Bilby
      </span>
      <button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Light or dark">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5 A8 8 0 1 1 9.5 4 a6.5 6.5 0 0 0 10.5 10.5 Z"/></svg>
      </button>
    </header>
    <main id="screen" tabindex="-1">
      <p class="quiet">Getting ready</p>
    </main>
  </body>
</html>
