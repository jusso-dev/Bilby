[package]
name = "bilby"
description = "Checks whether your computer shows signs of a problem, in plain words."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
bilby-core = { path = "../../crates/bilby-core" }
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# local-offset: "Last check at 9:41 am" in the local time zone.
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# Already in the tree through Tauri. Log lines for %LOCALAPPDATA%\Bilby\logs.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The file log layer (#17). No ANSI, no env-filter (and so no regex), no
# time crate formatting: plain lines with a UTC timestamp.
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
bilby-collect-windows = { path = "../../crates/bilby-collect-windows" }

[lints]
workspace = true
