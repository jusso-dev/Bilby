# Every word a person sees in Bilby. Rules: docs/copy-guide.md.
# Checked by crates/bilby-core/tests/copy_lint.rs.
# Variables use {name}. Values are inserted raw and escaped by the templates.

[app]
name = "Bilby"

[home]
heading = "Bilby"
intro = "Bilby checks whether anything on your computer looks wrong. It only looks, it doesn't change anything."
button = "Check my computer"

[scan]
heading = "Checking your computer"
online_off = "Online checks: off"
not_available = "Checking isn't available in this build yet."

[results]
placeholder = "{count} thing(s) to show. The full results screen comes later."

[light.healthy]
headline = "Looks healthy"
sub = "We checked {count} things and nothing needs you."

[light.worth_a_look]
headline = "Worth a look"
sub = "{n} thing(s) looked unusual. They're probably fine, but here's what to check."

[light.needs_attention]
headline = "Needs attention"
sub = "We found something that looks like a real problem. Here's what to do next."

[confidence]
high = "We're confident about this."
medium = "This is likely, but check first."
low = "This might be nothing."

[location]
public = "the shared Public folder"
recycle_bin = "the Recycle Bin"
program_data = "a shared program folder"
removable = "a removable drive"
network = "a network drive"
downloads = "your Downloads folder"
temp = "a temporary folder"
desktop = "your Desktop"
documents = "your Documents folder"
appdata = "a hidden folder in your user profile"
windows = "Windows' own folder"
program_files = "the Program Files folder"
other = "an unusual folder"

[check.skipped]
online_off = "Online checks are switched off."
no_defender = "Windows Security's antivirus isn't installed on this computer."
no_security_center = "This edition of Windows doesn't keep a list of security programs."
update_history = "Windows Update's history couldn't be read."

[evidence]
setting = "Setting"
signature_age = "Virus definitions age"
antivirus_enabled = "Antivirus switched on"
running_mode = "Antivirus mode"
realtime = "Real-time protection"
threat = "Threat"
resource = "Affected item"
detected_at = "First detected"
tamper = "Tamper protection"
product_state = "Windows Security product state"
firewall_profiles_off = "Firewall off for"
last_update = "Last successful update"
related = "Also seen"
parent = "Started by"
command_line = "Command line"
publisher = "Made by"
startup_state = "Startup state"
command = "Command"
service = "Service"
task = "Scheduled task"
wmi_namespace = "WMI namespace"
wmi_filter = "Triggered by"
wmi_engine = "Script language"
wmi_script = "Script"
wmi_class = "Consumer type"
boosted_by = "Raised by"
more_connections = "More connections not shown"
extension_id = "Extension ID"
browser_profile = "Browser and profile"
install_location = "Installed from"
permission = "Can access"
policy = "Set by policy"
update_url = "Updates from"
management = "Managed because"
shortcut = "Shortcut"
hosts_line = "Hosts file line"
proxy_server = "Proxy server"
pac_url = "Proxy settings address"
thumbprint = "Thumbprint"
cert_store = "Certificate store"
issuer = "Issued by"
not_before = "Valid from"
recent_root = "Recently added"
ms_list = "Microsoft's root list"
machine_cert = "Made by a computer for itself"
code_integrity = "Driver checks"
start_options = "Startup options"
created = "Added"
location = "Folder"

# Finding copy used by the demo reports. The scan engine issues replace and
# extend these as each rule lands.
[proc.masquerade.system_name]
title = "A program is pretending to be part of Windows."
what = "A file called {name} is running from {location}."
why = "The real {name} only lives inside Windows' own folder, so this is a common trick."
todo = "Ask Windows Security to scan it. Bilby can start that for you."

[proc.masquerade.lookalike]
title = "A program has a name very like part of Windows."
what = "A file called {name} is running from {location}. Its name is one letter away from {real}, a part of Windows."
why = "Harmful programs often pick names that look like Windows' own so they don't stand out."
todo = "Ask Windows Security to scan it. Bilby can start that for you."

[proc.unsigned_user_writable]
title = "A program without a digital signature is running from an unusual place."
what = "{name} is running from {location}. It has no valid digital signature (a seal that shows who made it)."
why = "Installed programs are usually signed and kept in Program Files. Downloads and temporary folders are where unwanted programs often land."
todo = "If you don't recognise it, ask Windows Security to scan it. Bilby can start that for you."

[proc.unsigned_appdata]
title = "An unsigned program is running from a hidden folder."
what = "{name} is running from {location} and has no digital signature."
why = "Many ordinary apps do this, so it's probably fine. It's only worth a look if you don't recognise it."
todo = "Check whether you recognise the name. If not, ask someone you trust to look."

[proc.core_parent]
title = "A core Windows program was started in an unusual way."
what = "{name} was started by {parent}. Normally only Windows' own start-up program starts it."
why = "This is a sign that something may be imitating a part of Windows."
todo = "Ask someone you trust to look at this computer."

[proc.core_duplicate]
title = "A part of Windows that should run once is running more than once."
what = "There are {count} copies of {name} running. Windows only ever runs one."
why = "An extra copy can be a harmful program using the same name."
todo = "Ask Windows Security to run a full scan."

[proc.script_host_encoded]
title = "A hidden PowerShell command is running."
what = "PowerShell is running a command that has been scrambled or hidden so it can't be read easily."
why = "Normal programs rarely hide their commands like this. Harmful programs often do."
todo = "Ask someone you trust to look at this computer."

[persist.run.unsigned_user_writable]
title = "A program without a digital signature starts by itself."
what = "{name} is set to start when you sign in. It runs from a folder anyone's programs can write to, and it has no digital signature (a seal that shows who made it)."
why = "Most programs that start by themselves are installed properly and signed. This one isn't."
todo = "Check whether you recognise it. If you don't, Bilby can stop it starting by itself, and you can undo that later."

[persist.run.script_host]
title = "A hidden script starts when you sign in."
what = "A startup entry called {name} runs a script in a way that hides what it does."
why = "Normal programs rarely start like this. Harmful programs often do."
todo = "Ask someone you trust to look at it. Bilby can stop it starting by itself, and you can undo that later."

[persist.run.rundll32_user_writable]
title = "A startup entry loads a file from an unusual folder."
what = "{name} uses a Windows helper to load a file from a folder anyone's programs can write to."
why = "This is a common way for harmful programs to hide behind a part of Windows."
todo = "Ask someone you trust to look at it. Bilby can stop it starting by itself, and you can undo that later."

[persist.run.missing_target]
title = "A startup entry points to a program that's gone."
what = "{name} is set to start, but the program it points to isn't there any more."
why = "This is usually left over from a program that was uninstalled. It's harmless."
todo = "Leave it. Nothing runs."

[persist.winlogon.shell]
title = "Windows is set to start a different desktop program."
what = "The setting that starts the Windows desktop has been changed to {value}."
why = "Normally it's just explorer.exe. A change here runs another program every time anyone signs in."
todo = "Ask someone you trust to look at this computer."

[persist.winlogon.userinit]
title = "An extra program runs every time anyone signs in."
what = "The Windows sign-in setting has been changed to {value}."
why = "Normally it only runs Windows' own sign-in program. Anything added here runs for every user."
todo = "Ask someone you trust to look at this computer."

[persist.ifeo.debugger]
title = "A program is set to run in place of {image}."
what = "Windows is set to run another program whenever {image} starts or closes."
why = "Developers and tools like Process Explorer use this on purpose. It can also be used to take over a program."
todo = "If you didn't set this up, ask someone you trust to look."

[persist.appinit]
title = "Windows is set to load an extra file into most programs."
what = "A setting called AppInit makes many programs load an extra file when they start."
why = "Modern programs rarely need this, and it's been used to hide harmful code."
todo = "Ask someone you trust to look at this computer."

[persist.service.user_writable]
title = "A Windows service runs from an unusual folder."
what = "The service {name} starts with Windows and runs a file from a folder anyone's programs can write to."
why = "Services run with full access to the computer, so they're normally installed in Windows' own folders or Program Files."
todo = "Ask someone you trust to look at it. Bilby can stop it starting, and you can undo that later."

[persist.service.unsigned]
title = "A Windows service has no digital signature."
what = "The service {name} runs a program with no digital signature (a seal that shows who made it), from outside Program Files."
why = "Services run with full access to the computer. Most are signed by the company that made them."
todo = "Check whether you recognise it. If you don't, ask someone you trust to look."

[persist.service.svchost_dll_outside_system]
title = "A Windows service loads a file from outside Windows' folders."
what = "The service {name} runs inside a shared Windows program but loads its code from somewhere else."
why = "Real Windows services keep this code in Windows' own folder. This is a way to hide inside a trusted program."
todo = "Ask someone you trust to look at this computer."

[persist.service.script_host]
title = "A Windows service runs a hidden script."
what = "The service {name} starts a script in a way that hides what it does, or from a folder anyone's programs can write to."
why = "Real services don't usually run scripts like this. Harmful programs often do, to come back after a restart."
todo = "Ask someone you trust to look at this computer."

[persist.task.user_writable]
title = "A scheduled task runs a program without a digital signature."
what = "The task {name} runs a program from a folder anyone's programs can write to, and it has no digital signature."
why = "Scheduled tasks are a common way for unwanted programs to come back after a restart."
todo = "Check whether you recognise it. If you don't, Bilby can turn the task off, and you can undo that later."

[persist.task.script_host]
title = "A scheduled task runs a hidden script."
what = "The task {name} runs a script in a way that hides what it does, or from a folder anyone's programs can write to."
why = "Normal tasks rarely run scripts like this. Harmful programs often do."
todo = "Ask someone you trust to look at it. Bilby can turn the task off, and you can undo that later."

[persist.task.hidden_unsigned]
title = "A hidden scheduled task runs an unsigned program."
what = "The task {name} is set to hide itself, and the program it runs has no digital signature."
why = "Programs from well-known companies rarely hide their tasks."
todo = "Check whether you recognise it. If you don't, Bilby can turn the task off, and you can undo that later."

[persist.task.missing_target]
title = "A scheduled task points to a program that's gone."
what = "The task {name} runs a program that isn't there any more."
why = "This is usually left over from a program that was uninstalled. It's harmless."
todo = "Leave it. Nothing runs."

[persist.wmi.command_consumer]
title = "A hidden Windows feature has been set up to run a program."
what = "A hidden Windows feature has been set up to run a program automatically. This is unusual on home computers. It's called a WMI subscription, and this one is named {name}."
why = "It doesn't show in Task Manager or Settings, so it's a way for a program to come back without being seen."
todo = "Ask someone you trust to look at this computer."

[persist.wmi.script_consumer]
title = "A hidden Windows feature has been set up to run a script."
what = "A hidden Windows feature has been set up to run a script automatically. This is unusual on home computers. It's called a WMI subscription, and this one is named {name}."
why = "Scripts run this way don't show in Task Manager or Settings. Harmful programs use this to stay hidden."
todo = "Ask someone you trust to look at this computer."

[persist.wmi.unbound_consumer]
title = "A leftover hidden Windows setting was found."
what = "A WMI subscription called {name} is set up to run something, but nothing triggers it."
why = "On its own it can't run. It's often left over from software that was removed, but it can also be left behind by harmful programs."
todo = "Ask someone you trust to look if you're worried. Otherwise you can leave it."

[net.outbound_from_suspicious]
title = "This program is also talking to the internet."
what = "{name} has a connection to an address on the internet."
why = "A program that was already unusual is more worth checking when it's online."
todo = "Ask Windows Security to scan it. Bilby can start that for you."

[net.listen_unsigned_user_writable]
title = "An unsigned program is waiting for connections from other computers."
what = "{name} runs from a folder anyone's programs can write to, has no digital signature, and is waiting for other computers to connect to it."
why = "Programs that accept connections from outside can be used to control a computer remotely."
todo = "If you don't recognise it, ask Windows Security to scan it. Bilby can start that for you."

[net.listen_script_host]
title = "A Windows scripting tool is waiting for connections from other computers."
what = "{name} is waiting for other computers to connect to it."
why = "Scripting tools rarely need to do this. It can be a sign of remote control."
todo = "Ask someone you trust to look at this computer."

[net.many_remote_peers]
title = "An unsigned program is talking to a lot of internet addresses."
what = "{name} has connections to {count} different internet addresses, and it has no digital signature."
why = "Ordinary programs usually talk to a handful of addresses. This might be nothing, but it's worth a check."
todo = "If you don't recognise it, ask Windows Security to scan it. Bilby can start that for you."

[browser.sideloaded_wide]
title = "A browser extension was added outside the store and can see every website."
what = "{name} in {browser} wasn't installed from the browser's store, and it can read and change every website you visit."
why = "Extensions added this way skip the store's checks. Some read passwords or change what you see on websites."
todo = "If you don't recognise it, remove it from the browser's extensions page."

[browser.forced_unmanaged]
title = "A browser extension has been forced on, and you can't remove it."
what = "A setting forces {name} on in {browser}. On a computer that isn't managed by an organisation, this is unusual."
why = "Unwanted software sometimes uses this setting so its extension can't be removed."
todo = "Ask someone you trust to look at this computer."

[browser.forced_managed]
title = "Your organisation installed this browser extension."
what = "Your organisation installed {name} in {browser} on this computer."
why = "Work and school computers often have extensions set by IT."
todo = "Leave it. Ask your IT team if you have questions."

[browser.shortcut_load_extension]
title = "A browser shortcut has been changed to load an extension."
what = "A shortcut that opens {browser} has been changed so it secretly loads an extension each time."
why = "This is a known trick to get an extension around the browser's own controls."
todo = "Ask someone you trust to look at this computer."

[browser.firefox_unsigned]
title = "A Firefox add-on hasn't been checked by Mozilla."
what = "{name} in Firefox isn't signed by Mozilla."
why = "Firefox normally only runs add-ons that Mozilla has checked."
todo = "If you don't recognise it, remove it from Firefox's add-ons page."

[browser.store_wide]
title = "A store extension can see every website."
what = "{name} in {browser} came from the browser's store and can read and change every website you visit."
why = "Many useful extensions need this, like ad blockers and password managers. It's for your helper's information."
todo = "Leave it if you use it."

[protection.no_active_av]
title = "No antivirus is protecting this computer."
what = "Windows Security's antivirus is switched off, and no other antivirus reports being on."
why = "Without antivirus, harmful files can run without anything checking them."
todo = "Open Windows Security and turn on virus and threat protection."

[protection.realtime_off]
title = "Windows Security's real-time protection is off."
what = "Windows Security is your antivirus, but it isn't checking files as they open."
why = "Without it, harmful files can run before anything checks them."
todo = "Open Windows Security and turn real-time protection back on."

[protection.signatures_stale]
title = "Windows Security's virus definitions are out of date."
what = "The last update was {days} days ago."
why = "Old definitions can miss newer threats."
todo = "Open Windows Security and check for updates."

[protection.detection_active]
title = "Windows Security found something it hasn't dealt with yet."
what = "It found {threat} in the last 30 days, and it's still listed as active."
why = "Something harmful may still be on this computer."
todo = "Open Windows Security, go to Protection history and follow its advice."

[protection.detection_resolved]
title = "Windows Security caught something and dealt with it."
what = "It handled {count} thing(s) in the last 30 days. The most recent was {threat}."
why = "This usually means your protection is working. It's worth knowing where it came from."
todo = "Have a look at Protection history in Windows Security. Nothing else is needed."

[protection.detection_executed]
title = "Something Windows Security caught had already started running."
what = "Windows Security dealt with {threat}, but it reports it ran before it was stopped."
why = "A program that ran may have changed things before it was removed."
todo = "Ask someone you trust to look at this computer, and run a full scan in Windows Security."

[protection.tamper_off]
title = "Tamper protection is off."
what = "This Windows Security setting stops other programs from switching your protection off."
why = "Some harmful programs try to turn antivirus off. Tamper protection blocks that."
todo = "Open Windows Security and turn on tamper protection."

[protection.third_party_off]
title = "Your antivirus reports that it's switched off."
what = "{product} is installed but reports being off, and Windows Security isn't covering for it."
why = "Without antivirus, harmful files can run without anything checking them."
todo = "Open {product} and switch it back on, or check whether its subscription has ended."

[protection.firewall_off]
title = "Windows Firewall is off."
what = "The firewall is off for the network you're connected to."
why = "The firewall blocks unwanted connections from other computers."
todo = "Open Windows Security and turn the firewall on."

[protection.uac_off]
title = "User Account Control is switched off."
what = "Windows no longer asks before programs make changes that need administrator access."
why = "That prompt is what stops a program from quietly changing system settings."
todo = "Ask someone you trust to switch User Account Control back on."

[protection.updates_old]
title = "Windows hasn't updated for a while."
what = "The last update that installed successfully was {days} days ago."
why = "Updates fix security problems that harmful programs use to get in."
todo = "Open Windows Update and check for updates."

[tamper.hosts.watch_domain]
title = "A trusted website has been redirected on this computer."
what = "The hosts file sends {name} to {ip} instead of the real {domain} site."
why = "This is how fake login pages steal passwords and banking details. The real site never needs this."
todo = "If you didn't set this up, Bilby can remove that line and keep a backup, and you can undo that later."

[tamper.hosts.path_moved]
title = "Windows is reading its hosts file from an unusual place."
what = "The setting that tells Windows where to find its hosts file has been changed."
why = "Moving it can hide redirects from tools that only check the usual place."
todo = "Ask someone you trust to look at this computer."

[tamper.hosts.many_entries]
title = "The hosts file blocks a lot of websites."
what = "The hosts file blocks {count} website addresses."
why = "This usually means an ad-blocking or privacy list was installed. It's for your helper's information."
todo = "Leave it if you set it up."

[tamper.proxy.unexpected]
title = "Your web traffic goes through another program or computer."
what = "Windows is set to send web traffic through {proxy}."
why = "Some workplaces and security tools do this on purpose. Unwanted programs sometimes do it to watch what you browse."
todo = "If you didn't set this up, Bilby can switch it off, and you can undo that later."

[tamper.proxy.pac_http]
title = "Your proxy settings come from an unprotected web address."
what = "Windows reads its proxy settings from {url}, which isn't a secure address."
why = "Someone on the network could change those settings and redirect your web traffic."
todo = "If you didn't set this up, Bilby can switch it off, and you can undo that later."

[tamper.winhttp_proxy]
title = "Windows itself sends some traffic through a proxy."
what = "A computer-wide proxy, {proxy}, is set for Windows services."
why = "Home computers rarely need this. It affects updates and other background traffic."
todo = "Ask someone you trust to look if you didn't set this up."

[tamper.root.known_bad]
title = "A dangerous certificate is trusted on this computer."
what = "A certificate called {known} is trusted. Its secret key was made public, so anyone can use it to fake websites."
why = "With it, fake websites can look secure, even banking sites."
todo = "Ask someone you trust to remove it from Windows' trusted certificates."

[tamper.root.unknown]
title = "An unfamiliar certificate is trusted on this computer."
what = "A certificate called {name} is trusted, but it isn't one of the certificates Windows normally trusts."
why = "Trusted certificates let a program read or change secure web traffic. Some security tools and workplaces add their own on purpose."
todo = "If you don't recognise it, ask someone you trust to look."

[tamper.root.dev_tool]
title = "A developer tool's certificate is trusted on this computer."
what = "{tool} added a certificate so it can inspect web traffic."
why = "Developers use this on purpose. It's for your helper's information."
todo = "Leave it if you use {tool}. Otherwise remove it from Windows' trusted certificates."

[drivers.test_signing]
title = "Windows is allowing untested drivers."
what = "Test signing is on, so Windows loads drivers that haven't been checked by Microsoft or a trusted maker."
why = "Drivers run at the deepest level of Windows. Harmful programs switch this on so they can load their own."
todo = "Ask your helper to look. If nobody here is a driver developer, it should be switched off."

[drivers.integrity_off]
title = "Windows has stopped checking drivers."
what = "Windows normally refuses drivers that aren't signed. That check is switched off on this computer."
why = "With the check off, any driver can load, including harmful ones."
todo = "Ask your helper to switch driver checks back on."

[drivers.kernel_debug]
title = "Kernel debugging is switched on."
what = "Windows is set up so another computer can inspect and change it while it runs."
why = "Developers use this on purpose. On a home computer it's unusual, and it can let unsigned code load."
todo = "If nobody here is a Windows developer, ask your helper to switch it off."

[drivers.unsigned_loaded]
title = "An unsigned driver is running."
what = "The driver {name} is loaded, but it isn't properly signed."
why = "Windows shouldn't let unsigned drivers run. One that does may have got around Windows' checks."
todo = "Ask someone you trust to look at this soon."

[drivers.unsigned_service]
title = "An unsigned driver is set to start."
what = "The driver {name} is set to start with Windows, but it isn't properly signed."
why = "It isn't running now, but it may try to load each time Windows starts."
todo = "Ask your helper whether it belongs to a device you use."

[drivers.user_writable]
title = "A driver lives in a folder anyone can change."
what = "The driver {name} is in a folder that ordinary programs can write to."
why = "Real drivers live in Windows' own folders. One that can be swapped by any program is a common trick."
todo = "Ask someone you trust to look at this soon."

[drivers.recent_unknown]
title = "A new driver from a less common maker."
what = "The driver {name} was added in the last two weeks."
why = "It's signed, so this is just for your helper's information."
todo = "If you recently plugged in a new device or installed new software, this is likely from that."

[drivers.blocklist_off]
title = "Windows' list of unsafe drivers is switched off."
what = "Windows keeps a list of drivers known to be unsafe and blocks them. That list is switched off here."
why = "Harmful programs sometimes bring an old, unsafe driver with them. The list stops that."
todo = "Open Windows Security, go to Device security, then Core isolation, and switch the list back on."

[drivers.memory_integrity_off]
title = "Memory integrity is switched off."
what = "This Windows Security feature blocks some harmful drivers. It's off on this computer."
why = "Many computers ship with it off, so this is just for your information."
todo = "Leave it, or open Windows Security to switch it on if your helper agrees."

[drivers.secure_boot_off]
title = "Secure Boot is switched off."
what = "Secure Boot checks that Windows starts up untouched. It's off on this computer."
why = "Many older computers have it off, so this is just for your information."
todo = "Leave it, or ask your helper about switching it on in the computer's startup settings."
