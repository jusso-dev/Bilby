# Windows programs that only belong in Windows' own folders. Used by the
# proc.masquerade.* rules. Folders are relative to %SystemRoot% and compared
# after normalisation.
#
# Checked on 10-11-2026 against the windows-latest runner (Windows Server
# 2025, image windows-2025-vs2026 20261103.629) by the processes smoke test
# in crates/bilby-collect-windows/tests/processes.rs, which prints every
# core process it sees with its path, parent and user. 16 of 23 rows ran
# there and matched. Rows marked "not seen on runner" follow Microsoft's
# documentation and a standard Windows 11 install.
#
# folders: where the real one lives. parents: the only programs allowed to
# start it, checked by proc.core_parent (leave out to skip the check).
# single: only one should ever run, checked by proc.core_duplicate.

[[process]]
name = "smss.exe"
folders = ["System32"]
single = false

[[process]]
name = "csrss.exe"
folders = ["System32"]
single = false

[[process]]
name = "wininit.exe"
folders = ["System32"]
single = true

[[process]]
name = "winlogon.exe"
folders = ["System32"]
single = false

[[process]]
name = "services.exe"
folders = ["System32"]
parents = ["wininit.exe"]
single = true

[[process]]
name = "lsass.exe"
folders = ["System32"]
parents = ["wininit.exe"]
single = true

[[process]]
name = "lsaiso.exe"
folders = ["System32"]
single = true

[[process]]
name = "svchost.exe"
folders = ["System32", "SysWOW64"]
single = false

[[process]]
name = "taskhostw.exe"
folders = ["System32"]
single = false

[[process]]
name = "sihost.exe"
folders = ["System32"]
single = false

[[process]]
name = "fontdrvhost.exe"
folders = ["System32"]
single = false

[[process]]
name = "dwm.exe"
folders = ["System32"]
single = false

[[process]]
name = "ctfmon.exe"
folders = ["System32", "SysWOW64"]
single = false

[[process]]
name = "conhost.exe"
folders = ["System32"]
single = false

[[process]]
name = "dllhost.exe"  # not seen on runner
folders = ["System32", "SysWOW64"]
single = false

[[process]]
name = "rundll32.exe"  # not seen on runner
folders = ["System32", "SysWOW64"]
single = false

[[process]]
name = "spoolsv.exe"
folders = ["System32"]
single = false

[[process]]
name = "runtimebroker.exe"
folders = ["System32"]
single = false

[[process]]
name = "searchindexer.exe"  # not seen on runner
folders = ["System32"]
single = false

[[process]]
name = "explorer.exe"
folders = ["", "SysWOW64"]
single = false

[[process]]
name = "userinit.exe"  # not seen on runner
folders = ["System32"]
single = false

[[process]]
name = "audiodg.exe"  # not seen on runner
folders = ["System32"]
single = false

[[process]]
name = "wmiprvse.exe"
folders = ["System32\\wbem", "SysWOW64\\wbem"]
single = false
