# Windows programs that only belong in Windows' own folders. Used by the
# proc.masquerade.* rules. Folders are relative to %SystemRoot% and compared
# after normalisation.
#
# Checked against the windows-latest runner (Windows Server 2025, image
# windows-2025-vs2026 20261103.629) by the processes smoke test in
# crates/bilby-collect-windows/tests/processes.rs, which prints every core
# process it sees with its path and parent. Rows marked "not seen on runner"
# didn't run there and follow Microsoft's documentation and Windows 11.
#
# folders: where the real one lives. parents: expected parent names (empty
# means don't check). single: only one should ever run.

[[process]]
name = "smss.exe"
folders = ["System32"]
parents = ["system", "smss.exe"]
single = false

[[process]]
name = "csrss.exe"
folders = ["System32"]
parents = []
single = false

[[process]]
name = "wininit.exe"
folders = ["System32"]
parents = []
single = true

[[process]]
name = "winlogon.exe"
folders = ["System32"]
parents = []
single = false

[[process]]
name = "services.exe"
folders = ["System32"]
parents = ["wininit.exe"]
single = true

