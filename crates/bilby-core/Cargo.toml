[package]
name = "bilby-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Same versions Tauri already pulls in, so no new copies in the tree.
sha2 = "0.11.1"
# Same version Tauri already pulls in. Parsing only.
toml = { version = "1.2.1", default-features = false, features = ["parse", "std", "serde"] }
time = { version = "0.3.55", default-features = false, features = ["std", "serde-well-known"] }

[lints]
workspace = true

[dev-dependencies]
time = { version = "0.3.55", default-features = false, features = ["std", "macros"] }
regex = "1.13.1"
