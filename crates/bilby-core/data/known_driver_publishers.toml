# Driver publishers common enough on home PCs that a new driver from them
# is ordinary. Used only by drivers.recent_unknown (Low/Low, context for the
# helper): a recent driver from anyone else is mentioned, never alarming.
#
# Matched against the signer's display name, ignoring case, as a prefix, so
# "Intel(R) Corporation" and "Intel Corporation" both match "intel".
# Microsoft-signed drivers (WHQL, "Microsoft Windows Hardware Compatibility
# Publisher") are always known, as are Windows components.
#
# These are hardware and platform vendors, not a security judgment: a
# signed driver from any publisher is still checked by the other rules.

