# Roots Windows itself ships or needs that aren't in Microsoft's trusted
# root program list (AuthRoot EncodedCtl), so tamper.root.unknown leaves
# them alone. Matched by SHA-1 thumbprint only: a certificate that copies
# one of these names but has a different thumbprint is still reported.
#
# Checked 10-11-2026 against the clean GitHub Actions windows-latest
# runner image (Microsoft-built), CI run 42761979151, which listed subject,
# serial and validity for each one.

[[root]]
name = "Microsoft Authenticode(tm) Root Authority"
sha1 = "7f88cd7223f3c813818c994614a89c99fa3b5247"
source = "Microsoft KB 293781 'Required trusted root certificates' (serial 01, expires 12/31/1999, 'Do not remove them'), https://learn.microsoft.com/en-us/troubleshoot/windows-server/certificates-and-public-key-infrastructure-pki/trusted-root-certificates-are-required. Subject and serial matched on the runner."

[[root]]
name = "Microsoft Timestamp Root (Copyright (c) 1997 Microsoft Corp.)"
sha1 = "245c97df7514e7cf2df8be72ae957b9e04741e85"
source = "Microsoft KB 293781, as above (issued to 'Copyright (c) 1997 Microsoft Corp.', serial 01, expires 12/30/1999). Subject and serial matched on the runner."

# Microsoft's own development and test roots. They aren't in KB 293781.
# They ship with Microsoft-built Windows images (seen on the runner) and
# Windows Insider builds. Self-signed by Microsoft Corporation.

[[root]]
