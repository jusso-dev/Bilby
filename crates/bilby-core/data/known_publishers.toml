# Publishers whose valid signature makes a location-based finding less
# likely to matter (#18). Exact signer display names, as Windows shows them
# (file Properties, Digital Signatures, "Name of signer"; Bilby reads the
# same simple display name with CertGetNameStringW).
#
# Every entry was checked against a real, validly signed file, named in
# `checked`. "PC" is a Windows 11 Pro 26200 laptop and "runner" is GitHub's
# windows-latest image, both read on 10 Nov 2026 with
# Get-AuthenticodeSignature (SignerCertificate simple name) or Bilby's own
# --dump-snapshot. A wrong string is worse than none: it would quietly
# trust a stranger, or never match. Names from #18's starting list that
# weren't checked yet are left out on purpose, listed at the end.
#
# Only a Signed status counts (valid, trusted chain). A name alone, or an
# invalid or untrusted signature, never matches.

