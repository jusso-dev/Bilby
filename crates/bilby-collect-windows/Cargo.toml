[package]
name = "bilby-collect-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
# Win32 calls need unsafe. Every unsafe block needs a SAFETY comment
# (clippy::undocumented_unsafe_blocks is denied below).
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
bilby-core = { path = "../bilby-core" }

[target.'cfg(windows)'.dependencies]
# Features are added one at a time by the scan engine issues. Each one is
# here because something in src/ needs it.
windows = { version = "0.62.2", default-features = false, features = [
  "Win32_Foundation",                    # HANDLE, HRESULT, CloseHandle
  "Win32_Security_WinTrust",             # WinVerifyTrust (sig.rs)
  "Win32_Security_Cryptography",         # CertGetNameStringW, EKU (sig.rs)
  "Win32_Security_Cryptography_Catalog", # CryptCATAdmin* (sig.rs)
  "Win32_Security_Cryptography_Sip",     # needed by the WTHelper* signer lookups (sig.rs)
  "Win32_Storage_FileSystem",            # CreateFileW, ReadFile, GetDriveTypeW
  "Win32_System_SystemInformation",      # GetSystemWindowsDirectoryW and friends
  "Win32_System_WindowsProgramming",     # DRIVE_REMOVABLE, DRIVE_REMOTE
  "Win32_System_Com",                    # CoTaskMemFree for SHGetKnownFolderPath
  "Win32_UI_Shell",                      # SHGetKnownFolderPath, FOLDERID_*
  "Win32_NetworkManagement_WindowsFirewall", # INetFwPolicy2 (defender.rs)
  "Win32_System_Registry",               # RegGetValueW, read-only (defender.rs)
  "Win32_System_UpdateAgent",            # update history (defender.rs)
  "Win32_System_Ole",                    # VARIANT_BOOL used by the COM getters
  "Win32_System_Variant",                # required by the UpdateAgent bindings
  "Win32_Security",                      # token user and elevation (processes.rs)
  "Win32_System_Diagnostics_ToolHelp",   # process snapshot (processes.rs)
  "Win32_System_Threading",              # OpenProcess, image path, times (processes.rs)
  "Win32_System_RemoteDesktop",          # ProcessIdToSessionId (processes.rs)
] }
sha2 = "0.10.9"
time = { version = "0.3.55", default-features = false, features = ["std"] }
# WMI queries. MIT or Apache-2.0, reuses our windows 0.62. Default chrono
# feature off: Bilby parses CIM datetimes itself in bilby-core.
wmi = { version = "0.18.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
time = { version = "0.3.55", default-features = false, features = ["std", "macros"] }
